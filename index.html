<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080a12">
<title>Hyrox Toulouse 27</title>
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hyrox 27">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Direction : console de performance, fond nuit, néons cyan / violet / corail. Colonne mobile, barre d'onglets en bas, gros boutons. */
:root{
  --bg:#080a12; --s1:#10131f; --s2:#171b2c; --line:#262c47; --tx:#eef1ff; --mu:#8a93b8;
  --cy:#27e0ff; --vi:#8b7bff; --co:#ff4f6d; --am:#ffb224; --gr:#35f09a;
  --disp:'Barlow Condensed','Arial Narrow',Impact,sans-serif;
  --body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font-family:var(--body);font-size:16px;line-height:1.35;overscroll-behavior:none}
button,input,textarea{font:inherit;color:inherit}
#app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto;position:relative;background:
  radial-gradient(120% 60% at 90% -10%,rgba(139,123,255,.16),transparent 60%),
  radial-gradient(90% 50% at -10% 0%,rgba(39,224,255,.10),transparent 55%),var(--bg)}
#top{display:flex;align-items:center;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top)) 16px 8px;min-height:52px}
#top .brand{font-family:var(--disp);font-weight:800;font-size:20px;letter-spacing:.12em;text-transform:uppercase}
#top .brand i{font-style:normal;color:var(--cy)}
#top .sync{font-size:12px;color:var(--mu);display:flex;align-items:center;gap:6px}
#top .sync b{width:8px;height:8px;border-radius:50%;background:var(--mu);display:inline-block}
#top .sync.ok b{background:var(--gr);box-shadow:0 0 8px var(--gr)}
#top .sync.err b{background:var(--co)}
#main{flex:1;overflow-y:auto;overflow-x:hidden;padding:4px 16px 24px;-webkit-overflow-scrolling:touch}
#tbar{padding:0 12px}
#tabs{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);background:rgba(8,10,18,.94);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
#tabs button{background:none;border:0;padding:8px 0 4px;color:var(--mu);display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;letter-spacing:.02em;text-transform:uppercase;min-height:52px;white-space:nowrap}
#tabs button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#tabs button.on{color:var(--cy)}
h1,h2,h3{margin:0;font-family:var(--disp);text-transform:uppercase;letter-spacing:.03em;text-wrap:balance}
h2{font-size:15px;color:var(--mu);letter-spacing:.14em;font-weight:700;margin:22px 0 10px}
.card{background:var(--s1);border:1px solid var(--line);border-radius:18px;padding:16px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:10px}
.mu{color:var(--mu)}
.num{font-variant-numeric:tabular-nums}
.chip{display:inline-flex;align-items:center;font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;padding:4px 10px;border-radius:99px;border:1px solid currentColor}
.c-cy{color:var(--cy)}.c-vi{color:var(--vi)}.c-co{color:var(--co)}.c-am{color:var(--am)}.c-gr{color:var(--gr)}.c-mu{color:var(--mu)}
.hero{padding:14px 2px 6px}
.hero .cd{font-family:var(--disp);font-weight:800;font-size:76px;line-height:.9;letter-spacing:.01em;background:linear-gradient(95deg,var(--cy),var(--vi) 60%,var(--co));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero small{display:block;color:var(--mu);margin-top:6px}
.segs{display:flex;gap:5px;margin:14px 0 2px}
.segs i{flex:1;height:6px;border-radius:4px;background:var(--s2)}
.segs i.d{background:var(--gr);box-shadow:0 0 8px rgba(53,240,154,.5)}
.sess{position:relative;overflow:hidden;border-radius:22px;padding:18px;background:linear-gradient(160deg,#171c33,#10131f 60%);border:1px solid var(--line)}
.sess::before{content:"";position:absolute;inset:0 auto 0 0;width:5px;background:var(--ac,var(--cy));box-shadow:0 0 18px var(--ac,var(--cy))}
.sess h1{font-size:40px;line-height:1;margin:10px 0 4px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.kpis div{background:var(--s2);border-radius:12px;padding:9px 10px;min-width:0}
.kpis b{display:block;font-family:var(--disp);font-size:20px;font-weight:700;line-height:1.1}
.kpis span{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mu)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:58px;border-radius:16px;border:0;font-family:var(--disp);font-weight:800;font-size:22px;letter-spacing:.08em;text-transform:uppercase;color:#05070d;background:var(--ac,var(--cy));box-shadow:0 0 22px -4px var(--ac,var(--cy));cursor:pointer}
.btn:active{transform:scale(.98)}
.btn.ghost{background:transparent;color:var(--tx);border:1px solid var(--line);box-shadow:none}
.btn.sm{min-height:46px;font-size:17px;width:auto;padding:0 16px}
.btn.gr{--ac:var(--gr)}.btn.co{--ac:var(--co)}.btn.vi{--ac:var(--vi)}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.days button{background:var(--s1);border:1px solid var(--line);border-radius:12px;min-height:58px;padding:6px 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;color:var(--mu)}
.days button b{font-family:var(--disp);font-size:18px;color:var(--tx)}
.days button.d{border-color:var(--gr)}.days button.d b{color:var(--gr)}
.days button.t{border-color:var(--cy);box-shadow:0 0 12px -2px var(--cy)}
.days button.r{opacity:.55}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:13px 2px;border-top:1px solid var(--line);background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%;min-height:56px}
.li:first-child{border-top:0}
.li .dt{width:46px;font-family:var(--disp);font-size:15px;color:var(--mu);text-transform:uppercase;letter-spacing:.06em}
.li .tt{flex:1;min-width:0}
.li .tt b{display:block;font-weight:600}
.li .tt small{color:var(--mu)}
.st{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-size:13px;color:#05070d}
.st.d{background:var(--gr);border-color:var(--gr)}
.wk{background:var(--s1);border:1px solid var(--line);border-radius:18px;margin-bottom:10px;overflow:hidden}
.wk.cur{border-color:var(--cy);box-shadow:0 0 18px -6px var(--cy)}
.wk>button{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;padding:14px;text-align:left;min-height:64px}
.wk .wn{font-family:var(--disp);font-weight:800;font-size:30px;width:54px}
.wk .wi{flex:1;min-width:0}.wk .wi small{display:block;color:var(--mu)}
.wk .body{padding:0 14px 8px}
.back{display:flex;align-items:center;gap:8px;background:none;border:0;color:var(--mu);padding:8px 0;min-height:44px;font-size:15px}
.ex{margin-bottom:14px}
.ex h3{font-size:22px}
.ex .meta{color:var(--mu);font-size:14px;margin:2px 0 8px}
.set,.rrow{display:grid;align-items:center;gap:8px;padding:8px 0}
.set{grid-template-columns:28px 1fr 1fr 64px}
.rrow{grid-template-columns:28px 1fr 84px 64px}
.rrow.s{grid-template-columns:28px 1fr 74px 74px 64px}
.rn{font-family:var(--disp);font-size:20px;color:var(--mu)}
.in{width:100%;min-height:54px;border-radius:14px;border:1px solid var(--line);background:var(--s2);text-align:center;font-size:19px;font-weight:600;padding:0 6px;font-variant-numeric:tabular-nums}
.in:focus{outline:2px solid var(--cy);outline-offset:1px}
textarea.in{text-align:left;padding:12px;min-height:90px;font-size:16px;font-weight:400}
.lbl{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mu);display:block;margin-bottom:4px;text-align:center}
.chk{width:64px;height:54px;border-radius:14px;border:2px solid var(--line);background:var(--s2);color:#3a4265;font-size:26px;font-weight:700;display:grid;place-items:center;cursor:pointer}
.chk.d{background:var(--gr);border-color:var(--gr);color:#05070d;box-shadow:0 0 16px -2px var(--gr)}
.rrow.d .rinfo b{color:var(--gr)}
.rinfo b{display:block;font-weight:600;font-size:16px}
.rinfo small{color:var(--mu)}
.prev{font-size:13px;color:var(--mu)}
.rest{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.rest button{flex:1;min-width:64px;min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--s2);font-family:var(--disp);font-size:20px;font-weight:700}
.rpe{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.rpe button{min-height:52px;border-radius:12px;border:1px solid var(--line);background:var(--s2);font-family:var(--disp);font-size:24px;font-weight:700}
.rpe button.on{background:var(--co);border-color:var(--co);color:#05070d}
.mini{display:flex;align-items:center;gap:12px;background:linear-gradient(95deg,#1a2140,#2a1740);border:1px solid var(--vi);border-radius:16px;padding:8px 8px 8px 14px;margin-bottom:8px;box-shadow:0 0 20px -4px var(--vi);width:100%;text-align:left}
.mini .tm{font-family:var(--disp);font-weight:800;font-size:34px;font-variant-numeric:tabular-nums;min-width:96px}
.mini .tl{flex:1;min-width:0;font-size:13px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .tl b{display:block;color:var(--tx);font-size:15px;overflow:hidden;text-overflow:ellipsis}
#ov{position:fixed;inset:0;z-index:20;background:rgba(6,8,15,.97);display:none;flex-direction:column;padding:calc(18px + env(safe-area-inset-top)) 20px calc(20px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto}
#ov.on{display:flex}
#ov .big{font-family:var(--disp);font-weight:800;font-size:min(34vw,170px);line-height:.95;text-align:center;font-variant-numeric:tabular-nums;margin-top:6vh;background:linear-gradient(95deg,var(--cy),var(--vi),var(--co));-webkit-background-clip:text;background-clip:text;color:transparent}
#ov .cue{font-family:var(--disp);font-weight:800;font-size:34px;text-align:center;text-transform:uppercase;line-height:1.05;margin-top:3vh;text-wrap:balance}
#ov .nx{text-align:center;color:var(--mu);margin-top:10px;min-height:22px}
#ov .bar{height:8px;border-radius:5px;background:var(--s2);margin:22px 0;overflow:hidden}
#ov .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cy),var(--vi))}
#ov .acts{margin-top:auto;display:grid;grid-template-columns:1fr 1fr;gap:10px}
#ov.flash .cue{color:var(--am)}
.tabbtns{display:flex;gap:8px}
.set-row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.set-row:first-child{border-top:0}
.sw{display:flex;align-items:center;gap:12px;min-height:50px;padding:6px 0}
.sw button{width:56px;height:32px;border-radius:99px;border:1px solid var(--line);background:var(--s2);position:relative;flex:none}
.sw button::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--mu);transition:.15s}
.sw button.on{background:rgba(39,224,255,.2);border-color:var(--cy)}
.sw button.on::after{left:27px;background:var(--cy)}
.tile{background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:12px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile b{display:block;font-family:var(--disp);font-size:34px;font-weight:800;line-height:1}
.tile span{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mu)}
svg.ch{width:100%;height:auto;display:block}
svg.ch text{font-family:var(--body);font-size:9.5px;fill:var(--mu)}
#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--s2);border:1px solid var(--gr);color:var(--tx);padding:10px 16px;border-radius:99px;opacity:0;pointer-events:none;transition:.25s;z-index:30;white-space:nowrap}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.note{font-size:14px;color:var(--mu)}
.tag{font-size:13px;color:var(--mu)}
a{color:var(--cy)}
.gtoc{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 16px}
.gtoc button{border:1px solid var(--line);background:var(--s1);border-radius:99px;padding:9px 14px;font-size:14px;font-weight:600;min-height:40px}
.gsec{background:var(--s1);border:1px solid var(--line);border-radius:18px;margin-bottom:10px;overflow:hidden}
.gsec[open]{border-color:#34406e}
.gsec summary{list-style:none;display:flex;align-items:center;gap:12px;padding:14px;min-height:62px;cursor:pointer}
.gsec summary::-webkit-details-marker{display:none}
.gk{font-family:var(--disp);font-weight:800;font-size:15px;color:var(--vi);width:26px}
.gt{flex:1;font-family:var(--disp);font-weight:700;font-size:22px;text-transform:uppercase;letter-spacing:.02em;line-height:1.05}
.gc::before{content:"+";font-size:24px;color:var(--mu)}
.gsec[open] .gc::before{content:"−"}
.gb{padding:0 14px 14px}
.gp{margin:8px 0;color:#cfd5f2;line-height:1.5}
.gh{font-size:17px;color:var(--cy);margin:18px 0 8px;letter-spacing:.06em}
.gex{background:var(--s2);border-radius:14px;padding:14px;margin:12px 0}
.gex h3{font-size:21px}
.gmeta{color:var(--am);font-size:14px;font-weight:600;margin:2px 0 6px}
.glab{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;margin:10px 0 4px}
.gol,.gul{margin:0;padding-left:20px;line-height:1.5;color:#dfe3fa}
.gol li,.gul li{margin:5px 0}
.gol.big li{margin:9px 0}
.gtip{margin-top:10px;padding:10px 12px;border-left:3px solid var(--cy);background:rgba(39,224,255,.07);border-radius:0 10px 10px 0;font-size:15px;line-height:1.45}
.gtw{overflow-x:auto;margin:8px 0}
.gtab{width:100%;border-collapse:collapse;font-size:14.5px}
.gtab th{text-align:left;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mu);padding:6px 8px;border-bottom:1px solid var(--line)}
.gtab td{padding:8px;border-bottom:1px solid #1d2238;vertical-align:top;font-variant-numeric:tabular-nums}
.qbtn{display:inline-flex;align-items:center;gap:6px;background:none;border:1px solid var(--line);color:var(--cy);border-radius:99px;padding:6px 12px;font-size:13px;font-weight:600;min-height:36px}
.exh{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
@media print{
  #top,#tabs,#tbar,#ov,#toast,.noprint,.gtoc,.back{display:none!important}
  html,body,#app,#main{background:#fff!important;color:#000!important;height:auto!important;overflow:visible!important}
  .gsec,.gex,.card{background:#fff!important;border:1px solid #bbb!important;break-inside:avoid}
  .gp,.gol,.gul,.gtab td,.gt,.gtip{color:#000!important}
  .hero .cd,.hero h1{color:#000!important;-webkit-text-fill-color:#000}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app">
  <header id="top"></header>
  <main id="main"></main>
  <div id="tbar"></div>
  <nav id="tabs"></nav>
</div>
<div id="ov"></div>
<div id="toast"></div>
<script>
(function(){
'use strict';

/* ---------- utilitaires ---------- */
var DAYS=['lun','mar','mer','jeu','ven','sam','dim'];
var DAYN={lun:'Lundi',mar:'Mardi',mer:'Mercredi',jeu:'Jeudi',ven:'Vendredi',sam:'Samedi',dim:'Dimanche'};
var DAYS1={lun:'L',mar:'M',mer:'M',jeu:'J',ven:'V',sam:'S',dim:'D'};
var MON=['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
var ICON=(document.querySelector('link[rel=apple-touch-icon]')||{}).href||'';
var LS_KEY='hx27_state',LS_UI='hx27_ui',LS_TIMER='hx27_timer';
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function pad(n){return (n<10?'0':'')+n;}
function fmtT(sec){sec=Math.max(0,Math.round(sec));var h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;return h?h+':'+pad(m)+':'+pad(s):m+':'+pad(s);}
function fmtPace(sec){sec=Math.round(sec);return Math.floor(sec/60)+':'+pad(sec%60);}
function parseT(str){
  if(str==null)return NaN;str=String(str).trim().replace(',','.').replace(/\s/g,'');
  if(!str)return NaN;
  if(/^\d+(\.\d+)?$/.test(str))return parseFloat(str)*60;
  var p=str.split(':').map(Number);
  if(p.some(isNaN))return NaN;
  if(p.length===2)return p[0]*60+p[1];
  if(p.length===3)return p[0]*3600+p[1]*60+p[2];
  return NaN;
}
function pd(s){var a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2]);}
function addDays(d,n){var x=new Date(d.getTime());x.setDate(x.getDate()+n);return x;}
function dayDiff(a,b){return Math.round((b.getTime()-a.getTime())/864e5);}
function today0(){var n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate());}
function fmtD(d){return d.getDate()+' '+MON[d.getMonth()];}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function num(v){var n=parseFloat(String(v).replace(',','.'));return isNaN(n)?NaN:n;}
function fnum(v){return String(v).replace('.',',');}

/* ---------- état ---------- */
function defaults(){return {v:1,updatedAt:0,settings:{race:'2027-02-06',start:'2026-11-16',base5k:'25:00',sound:true,autoRest:true,wake:true,bgAudio:true},logs:{}};}
var S=defaults();
var UI={tab:'today',sess:null,open:{},scroll:0,gOpen:{},gReturn:null};
var T=null;
function lsGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}
function lsDel(k){try{localStorage.removeItem(k);}catch(e){}}
function normalize(r){var d=defaults();if(!r||typeof r!=='object')return d;
  d.updatedAt=r.updatedAt||0;
  if(r.settings){for(var k in r.settings){d.settings[k]=r.settings[k];}}
  d.logs=r.logs||{};return d;}
function load(){
  try{var a=lsGet(LS_KEY);if(a)S=normalize(JSON.parse(a));}catch(e){}
  try{var b=lsGet(LS_UI);if(b){var u=JSON.parse(b);UI.tab=u.tab||'today';UI.sess=u.sess||null;UI.open=u.open||{};UI.gOpen=u.gOpen||{};}}catch(e){}
  try{var c=lsGet(LS_TIMER);if(c){var t=JSON.parse(c);if(t&&(Date.now()-t.startAt)/1000<t.total+30)T=t;}}catch(e){}
}
function saveUI(){lsSet(LS_UI,JSON.stringify({tab:UI.tab,sess:UI.sess,open:UI.open,gOpen:UI.gOpen}));}
function touch(){S.updatedAt=Date.now();lsSet(LS_KEY,JSON.stringify(S));remoteSave();}

/* ---------- allures ---------- */
function lastTest(){
  var best=null;
  for(var w=1;w<=12;w++){var l=S.logs['w'+w+'-sam'];if(l&&l.data&&l.data.t){var s=parseT(l.data.t);if(s>600&&s<3600)best={w:w,secs:s};}}
  return best;
}
function P5(){var t=lastTest();if(t)return t.secs/5;var b=parseT(S.settings.base5k);return (b>600&&b<3600)?b/5:300;}
function pace(mult){return fmtPace(P5()*mult);}
function z2km(min){return min*60/(P5()*1.25);}

/* ---------- plan ---------- */
function phaseOf(w){
  if(w<=3)return {n:'Base',c:'cy'};
  if(w===4)return {n:'Décharge',c:'mu'};
  if(w<=7)return {n:'Build',c:'vi'};
  if(w===8)return {n:'Décharge + test',c:'mu'};
  if(w<=10)return {n:'Spécifique',c:'co'};
  if(w===11)return {n:'Affûtage',c:'am'};
  return {n:'Course',c:'gr'};

var AC=null,nodes=[],WL=null,lastMark=-1,tickH=null;

  if(AC&&AC.state==='suspended'){try{AC.resume();}catch(e){}}

  try{
    var o=ac.createOscillator(),g=ac.createGain();
    o.type='square';o.frequency.value=freq;
    g.gain.setValueAtTime(0.0001,at);
    g.gain.exponentialRampToValueAtTime(vol,at+0.01);
    g.gain.exponentialRampToValueAtTime(0.0001,at+dur);
    o.connect(g);g.connect(ac.destination);o.start(at);o.stop(at+dur+0.02);

function beepPlan(from){
  var b=[];if(!T)return b;
  function add(t,f,d,v){if(t>from+0.05)b.push({t:t,f:f,d:d,v:v});}
  T.marks.forEach(function(m,i){
    add(m.t,m.tone==='lo'?660:1040,0.45,1);
    var prev=i>0?T.marks[i-1].t:0;
    if(m.t-prev>=8){[3,2,1].forEach(function(c){add(m.t-c,880,0.12,0.7);});}
  });
  var last=T.marks.length?Math.max.apply(null,T.marks.map(function(m){return m.t;})):0;
  if(T.total-last>=8){[3,2,1].forEach(function(c){add(T.total-c,880,0.12,0.7);});}
  add(T.total,1320,0.25,1);add(T.total+0.32,1320,0.25,1);add(T.total+0.64,1320,0.5,1);
  return b;
}

  var ac=actx();if(!ac)return;
  var el=elapsed(),base=ac.currentTime;
  beepPlan(el).forEach(function(x){beep(ac,base+(x.t-el),x.f,x.d,0.22*x.v);});

/* Piste audio continue : un fichier WAV contenant tous les bips et le silence entre eux.

var AEL=null,AURL=null,SR=8000,aelRejectAt=0;
function aelInit(){
  if(AEL)return AEL;
  try{AEL=document.createElement('audio');AEL.setAttribute('playsinline','');AEL.setAttribute('webkit-playsinline','');AEL.preload='auto';AEL.style.display='none';document.body.appendChild(AEL);}catch(e){AEL=null;}
  return AEL;
}
function wstr(v,o,s){for(var i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i));}
function buildWav(from){
  var n=Math.ceil(Math.max(0.5,T.total+1.6-from)*SR);if(n%2)n++;
  var buf=new ArrayBuffer(44+n),v=new DataView(buf),u=new Uint8Array(buf,44);
  wstr(v,0,'RIFF');v.setUint32(4,36+n,true);wstr(v,8,'WAVE');wstr(v,12,'fmt ');
  v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,SR,true);
  v.setUint32(28,SR,true);v.setUint16(32,1,true);v.setUint16(34,8,true);wstr(v,36,'data');v.setUint32(40,n,true);
  u.fill(128);
  beepPlan(from).forEach(function(x){
    var s0=Math.round((x.t-from)*SR),len=Math.round(x.d*SR),per=SR/x.f,amp=x.v*95,att=0.01*SR,rel=0.06*SR;
    for(var i=0;i<len;i++){

      var env=Math.min(1,i/att,(len-i)/rel),sq=(i%per)<per/2?1:-1;

function aelHalt(){
  if(AEL){try{AEL.pause();}catch(e){}try{AEL.removeAttribute('src');AEL.load();}catch(e){}}
  if(AURL){try{URL.revokeObjectURL(AURL);}catch(e){}AURL=null;}
}
function mediaMeta(){
  try{
    if(!('mediaSession' in navigator))return;

    navigator.mediaSession.playbackState='playing';

function armAudio(){
  cancelAudio();

  if(!T)return;
  if(!S.settings.sound){aelHalt();return;}
  if(S.settings.bgAudio&&aelInit()){
    try{
      var from=Math.max(0,elapsed());

      var p=AEL.play(),id=T.id;
      if(p&&p.then){
        p.then(function(){if(T&&T.id===id){mediaMeta();saveT();}})
         .catch(function(){aelRejectAt=Date.now();if(T&&T.id===id){T.mode='wa';scheduleAudio();saveT();}});

}

      marks.push({t:x,label:l,tone:x%600===0?'lo':'hi'});
    }
    marks.push({t:tot,label:'Fin · retour au calme'});
    return {kind:'seq',label:s.title,total:tot,marks:marks};
  }
  if(s.type==='reps'){
    if(!s.rounds[0].runSec)return null;
    s.rounds.forEach(function(r,i){
      marks.push({t:t,label:'Effort '+(i+1)+'/'+s.rounds.length+' · '+pace(r.mult)+'/km'});
      t+=r.runSec;
      if(i<s.rounds.length-1){marks.push({t:t,label:'Récup '+fmtT(r.rest),tone:'lo'});t+=r.rest;}
    });
    return {kind:'seq',label:s.title,total:t,marks:marks};
  }
  return null;
}

/* ---------- synchro distante ---------- */
var REM=null,remWriting=false,remDirty=false,remTimer=null,syncState='local';
function setSync(s){syncState=s;var e=document.getElementById('sync');if(e){e.className='sync '+(s==='ok'?'ok':(s==='err'?'err':''));e.querySelector('span').textContent=({ok:'Synchronisé',local:(window.claude?'Local':'Sur ce téléphone'),slow:'Hors ligne',err:'Erreur synchro',cache:'Cache'})[s]||'Local';}}
function initRemote(){
  try{
    if(!window.claude||!window.claude.use)return;
    Promise.all([window.claude.use('db'),window.claude.use('user')]).then(function(r){
      var db=r[0],user=r[1];if(!db||!user)return;
      return user.id().then(function(uid){
        if(!uid)return;
        REM=db.doc('data/users/'+uid+'/state');
        var to=setTimeout(function(){if(syncState!=='ok')setSync('slow');},10000);
        REM.onSnapshot(function(snap){clearTimeout(to);onRemote(snap);},function(){clearTimeout(to);setSync('local');});
      });
    }).catch(function(){setSync('local');});
  }catch(e){setSync('local');}
}
function onRemote(snap){
  if(snap.metadata&&snap.metadata.hasPendingWrites)return;
  if(!snap.exists){setSync('ok');if(S.updatedAt)remoteSave(true);return;}
  var d=snap.data(),r=null;
  try{r=JSON.parse(d.json);}catch(e){return;}
  var ru=d.updatedAt||0;
  if(ru>S.updatedAt){S=normalize(r);S.updatedAt=ru;lsSet(LS_KEY,JSON.stringify(S));renderSoft();}
  else if(ru<S.updatedAt){remoteSave();}
  setSync(snap.metadata&&snap.metadata.fromCache?'cache':'ok');
}
function remoteSave(now){
  if(!REM)return;remDirty=true;clearTimeout(remTimer);remTimer=setTimeout(flushRemote,now?0:1200);
}
function flushRemote(){
  if(!REM||remWriting||!remDirty)return;
  remWriting=true;remDirty=false;
  REM.set({json:JSON.stringify(S),updatedAt:S.updatedAt}).then(function(){remWriting=false;setSync('ok');if(remDirty)flushRemote();})
  .catch(function(){remWriting=false;remDirty=true;setSync('err');setTimeout(flushRemote,10000);});
}

/* --- progrès --- */
function chartBars(vals,cw){
  var W=320,H=140,pl=8,pb=20,pt=14,bw=18,mx=0;
  vals.forEach(function(v){mx=Math.max(mx,v.p,v.d);});mx=Math.max(mx,10);
  var g=(W-pl*2-bw*12)/11,h='<svg class="ch" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Kilomètres de course par semaine">';
  for(var i=0;i<12;i++){
    var v=vals[i],x=pl+i*(bw+g),hp=(v.p/mx)*(H-pb-pt),hd=(v.d/mx)*(H-pb-pt),y0=H-pb;
    h+='<rect x="'+x+'" y="'+(y0-hp)+'" width="'+bw+'" height="'+hp+'" rx="3" fill="none" stroke="var(--line)" stroke-width="1.5"/>';
    if(hd>0)h+='<rect x="'+x+'" y="'+(y0-hd)+'" width="'+bw+'" height="'+hd+'" rx="3" style="fill:var(--cy)"/>';
    if(v.d>0)h+='<text x="'+(x+bw/2)+'" y="'+(y0-Math.max(hd,hp)-3)+'" text-anchor="middle" style="fill:var(--tx)">'+Math.round(v.d)+'</text>';
    h+='<text x="'+(x+bw/2)+'" y="'+(H-6)+'" text-anchor="middle" style="'+(i+1===cw?'fill:var(--cy);font-weight:600':'')+'">'+(i+1)+'</text>';
  }
  return h+'</svg>';
}
function chartLine(pts,opt){
  var W=320,H=150,pl=34,pr=12,pt=14,pb=22;
  if(!pts.length)return '<div class="note" style="padding:18px 0">'+esc(opt.empty)+'</div>';
  var ys=pts.map(function(p){return p.y;});if(opt.target!=null)ys.push(opt.target);
  var mn=Math.min.apply(null,ys),mx=Math.max.apply(null,ys),sp=Math.max(mx-mn,opt.minSpan||1);mn-=sp*0.2;mx+=sp*0.2;
  function X(w){return pl+(w-1)/11*(W-pl-pr);}
  function Y(v){var r=(v-mn)/(mx-mn);return opt.inv?pt+r*(H-pt-pb):H-pb-r*(H-pt-pb);}
  var h='<svg class="ch" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(opt.label)+'">';
  for(var w=1;w<=12;w+=1)h+='<text x="'+X(w)+'" y="'+(H-6)+'" text-anchor="middle">'+w+'</text>';
  h+='<line x1="'+pl+'" y1="'+(H-pb)+'" x2="'+(W-pr)+'" y2="'+(H-pb)+'" stroke="var(--line)"/>';
  if(opt.target!=null)h+='<line x1="'+pl+'" y1="'+Y(opt.target)+'" x2="'+(W-pr)+'" y2="'+Y(opt.target)+'" stroke="var(--gr)" stroke-dasharray="4 4"/><text x="2" y="'+(Y(opt.target)+3)+'" style="fill:var(--gr)">'+esc(opt.tlabel)+'</text>';
  var d=pts.map(function(p,i){return (i?'L':'M')+X(p.x).toFixed(1)+' '+Y(p.y).toFixed(1);}).join(' ');
  if(pts.length>1)h+='<path d="'+d+'" fill="none" style="stroke:var(--cy)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>';
  pts.forEach(function(p){h+='<circle cx="'+X(p.x)+'" cy="'+Y(p.y)+'" r="4.5" style="fill:var(--cy)"/><text x="'+X(p.x)+'" y="'+(Y(p.y)-9)+'" text-anchor="middle" style="fill:var(--tx)">'+esc(p.t)+'</text>';});
  return h+'</svg>';
}
function vProgress(){
  var cw=curWeek(),tot=0,done=0,km=0,rpes=[],bars=[],dlp=[],tests=[];
  for(var w=1;w<=12;w++){
    var st=weekStat(w);tot+=st.total;done+=st.done;km+=st.dk;
    bars.push({p:st.pk,d:st.dk});
    allSessions(w).forEach(function(s){var l=S.logs[s.key];if(l&&l.done&&l.rpe)rpes.push(l.rpe);});
    var l1=S.logs['w'+w+'-lun'];
    if(l1&&l1.data&&l1.data.ex&&l1.data.ex.dl){var m=0;l1.data.ex.dl.forEach(function(r){var k=num(r.kg);if(r.d&&!isNaN(k))m=Math.max(m,k);});if(m>0)dlp.push({x:w,y:m,t:fnum(m)});}
    var l2=S.logs['w'+w+'-sam'];
    if(l2&&l2.data&&l2.data.t){var tt=parseT(l2.data.t);if(tt>600&&tt<3600&&(w===1||w===8))tests.push({x:w,y:tt,t:fmtT(tt)});}
  }
  var avg=rpes.length?(rpes.reduce(function(a,b){return a+b;},0)/rpes.length):0;
  var lt=lastTest(),pr=lt?projection(lt.secs):null;
  var h='<h2 style="margin-top:8px">Progression</h2><div class="tiles"><div class="tile"><b class="c-gr">'+done+'<span style="font-size:18px;color:var(--mu)"> / '+tot+'</span></b><span>Séances faites</span></div><div class="tile"><b class="c-cy">'+Math.round(km)+'</b><span>km courus (estimés)</span></div><div class="tile"><b class="c-co">'+(avg?avg.toFixed(1).replace('.',','):'–')+'</b><span>RPE moyen</span></div><div class="tile"><b class="c-vi">'+(pr?fmtT(pr):'–')+'</b><span>Hyrox estimé</span></div></div>';
  h+='<div class="note" style="margin-top:8px">'+(pr?'Estimation basée sur ton dernier test 5 km ('+fmtT(lt.secs)+'). Objectif : moins de 1:15:00.':'Fais le test 5 km de la semaine 1 pour obtenir une estimation de ton temps Hyrox.')+'</div>';
  h+='<h2>Km de course par semaine</h2><div class="card">'+chartBars(bars,cw)+'<div class="note">Contour : prévu. Plein : fait.</div></div>';
  h+='<h2>Tests 5 km</h2><div class="card">'+chartLine(tests,{inv:true,target:1380,tlabel:'23:00',label:'Tests 5 km',empty:'Premier test en semaine 1, second en semaine 8.',minSpan:120})+'</div>';
  h+='<h2>Trap-bar : meilleure série (kg)</h2><div class="card">'+chartLine(dlp,{label:'Charge soulevé de terre',empty:'Valide tes séries du lundi pour voir ta courbe.',minSpan:10})+'</div>';
  return h;
}

  );
  h+='<div class="noprint" style="margin:18px 0 8px"><button class="btn ghost sm" data-a="gprint" style="width:100%">Exporter le guide en PDF</button></div>';

function guideFor(s){

function gotoGuide(id,ret){

  var parent={'g-dl':'g-force','g-bss':'g-force','g-pu':'g-force','g-inc':'g-force','g-row':'g-force','g-core':'g-force','g-ski':'g-st','g-push':'g-st','g-pull':'g-st','g-bbj':'g-st','g-rower':'g-st','g-farm':'g-st','g-lunge':'g-st','g-wb':'g-st','g-emom':'g-sat','g-test':'g-sat','g-thor':'g-mob'}[id];
  if(parent)UI.gOpen[parent]=true;

}

/* ---------- événements ---------- */
function act(a,el){
  var l;
  switch(a){
    case 'tab':UI.tab=el.dataset.t;UI.sess=null;UI.gReturn=null;saveUI();render();break;
    case 'guide':gotoGuide(el.dataset.g,UI.sess);break;
    case 'gjump':gotoGuide(el.dataset.g,UI.gReturn);break;
    case 'gback':UI.sess=UI.gReturn;UI.gReturn=null;saveUI();render();break;
    case 'gprint':document.querySelectorAll('details.gsec').forEach(function(d){d.open=true;});try{window.print();}catch(e){toast('Utilise Partager puis Imprimer');}break;
    case 'open':UI.sess=el.dataset.k;saveUI();wake();render();break;
    case 'back':UI.sess=null;saveUI();if(!T)unwake();render();break;
    case 'wk':var n=parseInt(el.dataset.w,10),cur=UI.open[n]!=null?UI.open[n]:(n===curWeek());UI.open[n]=!cur;saveUI();render();break;
    case 'set':{
      var s=sessionOf(parseInt(UI.sess.split('-')[0].slice(1),10),'lun');l=S.logs[UI.sess];
      var row=l.data.ex[el.dataset.e][parseInt(el.dataset.i,10)];row.d=!row.d;touch();
      if(row.d){var ex=FORCE_EX.filter(function(e){return e.id===el.dataset.e;})[0];if(S.settings.autoRest)startRest(ex.rest,'Repos · '+ex.name);}
      render();break;}
    case 'addset':{l=S.logs[UI.sess];var arr=l.data.ex[el.dataset.e],lr=arr[arr.length-1];arr.push({kg:lr?lr.kg:'',reps:lr?lr.reps:'',d:false});touch();render();break;}
    case 'rmset':{l=S.logs[UI.sess];var ar=l.data.ex[el.dataset.e];if(ar.length>1)ar.pop();touch();render();break;}
    case 'rdone':{
      l=S.logs[UI.sess];var rr=l.data.r[parseInt(el.dataset.i,10)];rr.d=!rr.d;touch();
      if(rr.d&&S.settings.autoRest){var sp=UI.sess.split('-'),ss=sessionOf(parseInt(sp[0].slice(1),10),sp[1]),rd=ss.rounds[parseInt(el.dataset.i,10)];if(rd&&rd.rest&&!rd.runSec)startRest(rd.rest,'Récup · bloc '+(parseInt(el.dataset.i,10)+1));}
      render();break;}
    case 'cdone':{l=S.logs[UI.sess];var c=l.data.c[parseInt(el.dataset.i,10)];c.d=!c.d;touch();if(c.d&&S.settings.autoRest)startRest(120,'Repos entre tours');render();break;}
    case 'chk':{l=S.logs[UI.sess];var i=parseInt(el.dataset.i,10);l.data.chk[i]=!l.data.chk[i];touch();render();break;}
    case 'rpe':l=S.logs[UI.sess];l.rpe=parseInt(el.dataset.v,10);touch();render();break;
    case 'finish':l=S.logs[UI.sess];l.done=true;l.fin=Date.now();touch();toast('Séance validée ✓');UI.sess=null;saveUI();if(!T)unwake();render();break;
    case 'reopen':l=S.logs[UI.sess];l.done=false;touch();render();break;
    case 'rest':startRest(parseInt(el.dataset.s,10),'Repos');break;
    case 'seq':{var sp2=UI.sess.split('-'),s2=sessionOf(parseInt(sp2[0].slice(1),10),sp2[1]),q=seqFor(s2);if(q)startTimer(q);break;}
    case 'tstop':stopTimer();break;
    case 'ovopen':UI.ov=true;renderOv();break;
    case 'ovclose':UI.ov=false;renderOv();break;
    case 'plus':if(T){T.total+=30;saveT();armAudio();}break;
    case 'sw':{var id=el.dataset.id;S.settings[id]=!S.settings[id];touch();if((id==='sound'||id==='bgAudio')&&T)armAudio();if(id==='wake'){if(S.settings.wake)wake();else unwake();}render();break;}
    case 'locktest':startTimer({kind:'seq',label:'Test écran verrouillé',total:45,marks:[{t:0,label:'Verrouille ton écran maintenant'},{t:15,label:'Bip 1 · 15 s'},{t:30,label:'Bip 2 · 30 s',tone:'lo'}]});break;
    case 'testsound':{var ac=actx();if(ac){beep(ac,ac.currentTime+0.05,1040,0.3,0.25);beep(ac,ac.currentTime+0.45,1320,0.4,0.25);}toast('Son envoyé');break;}
    case 'copy':{var bk=document.getElementById('bk');try{bk.focus();bk.select();navigator.clipboard.writeText(bk.value).then(function(){toast('Sauvegarde copiée');}).catch(function(){toast('Sélectionne et copie le texte');});}catch(e){toast('Sélectionne et copie le texte');}break;}
    case 'import':{var v=document.getElementById('imp').value;try{var r=JSON.parse(v);if(!r||!r.logs)throw 0;S=normalize(r);touch();toast('Sauvegarde restaurée');render();}catch(e){toast('Texte de sauvegarde invalide');}break;}
    case 'reset':if(UI.confirmReset){S.logs={};touch();UI.confirmReset=false;toast('Séances effacées');}else{UI.confirmReset=true;}render();break;
  }
}
